[bootstrap.macos.dock]
autohide = true
orientation = "right"
tilesize = 16
magnification = false
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = true
preferred_view_style = "icon"

[bootstrap.macos.keyboard]
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = true

[bootstrap.user]
login_shell = "/bin/zsh"

[settings]
idiomatic_version_file_enable_tools = ["node"]
experimental = true
minimum_release_age = "7d"
minimum_release_age_excludes = ["github:yusukebe/ax", "npm:@openai/codex"]
lockfile = true
not_found_auto_install = false

[settings.npm]
package_manager = "bun"

[tasks.bootstrap]
description = "Merge local Codex configuration"
run = 'cargo run --quiet --manifest-path "$HOME/workspace/github.com/ayuzaka/dotfiles/scripts/merge-codex-config/Cargo.toml" --'

[tasks.git-signing-key-create]
description = "Create and register a Git signing key"
dir = "{{env.HOME}}"
run = '''
sc_auth create-ctk-identity -l git-sign -k p-256-ne -t none
ssh-keygen -w /usr/lib/ssh-keychain.dylib -K -N ""

mv id_ecdsa_sk_rk "$HOME/.ssh/id_git_sign"
mv id_ecdsa_sk_rk.pub "$HOME/.ssh/id_git_sign.pub"
'''

[tasks.macskk-download]
description = "Download the latest macSKK DMG"
tools.jq = "latest"
run = '''
asset_url="$(
  curl --fail --silent --show-error --location \
    "https://api.github.com/repos/mtgto/macSKK/releases/latest" |
    jq --exit-status --raw-output '
      [.assets[] | select(.name | endswith(".dmg"))]
      | if length == 1 then
          .[0].browser_download_url
        else
          error("expected exactly one DMG asset")
        end
    '
)"

destination="$HOME/Downloads/${asset_url##*/}"

curl --fail --show-error --location \
  --output "$destination" \
  "$asset_url"

printf 'Downloaded: %s\n' "$destination"
'''

[tasks.macos-init]
description = "Apply one-time macOS settings"
run = '''
# スクリーンショットの保存名
defaults write com.apple.screencapture name "screenShot"

# スクリーンショットの保存先
defaults write com.apple.screencapture location ~/Downloads

# すべての拡張子のファイルを表示する
defaults write NSGlobalDomain AppleShowAllExtensions -bool true

# .DS_Store ファイルを作らない
defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true

# Dock からアプリを削除
defaults write com.apple.dock persistent-apps -array

# Dock の設定を反映
killall Dock
'''
