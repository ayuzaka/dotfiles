onboarding = false

[keys]
prefix = "ctrl+space"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+["
next_tab = "prefix+]"
# herdr 標準の worktree 作成は ~/.herdr/worktrees/<repo>/<branch> 固定。
# .git-wt（git-wt）を使うので unbound。作成は `git wt <branch>`。
new_worktree = ""

# herdr の global worktree root は使わない（作成は git-wt 側）。
# [worktrees]
# directory = "~/.herdr/worktrees"

[ui]
prompt_new_tab_name = false
agent_panel_sort = "priority"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[experimental]
pane_history = true

[theme]
name = "gruvbox-light"
auto_switch = false
