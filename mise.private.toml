[vars]
dotfiles_purpose = "private"

[dotfiles]
"~/.cursor" = { source = "dotfiles/.cursor", mode = "symlink-each" }
"~/.config/opencode" = { source = "dotfiles/opencode", mode = "symlink-each" }
"~/.config/ghtkn/ghtkn.yaml" = { source = "templates/.config/ghtkn/ghtkn.yaml", mode = "template" }

[tools]
cursor-agent = "latest"
ghtkn = "latest"
opencode = "latest"
turso = "latest"
"go:tailscale.com/cmd/tailscale" = "main"
"go:tailscale.com/cmd/tailscaled" = "main"
"npm:obsidian-headless" = "latest"

[bootstrap.packages]
"brew-cask:orbstack" = "latest"
"brew-cask:yubico-authenticator" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:abue-ammar/tinycast/tinycast" = "latest"
"mas:302584613" = "latest"  # Kindle

# Cursor plan usage → RunCat Neo custom metrics JSON
[bootstrap.macos.launchd.agents.runcat-cursor-usage]
program = "~/.cursor/runcat-hook.py"
run_at_load = true
start_interval = 300
environment = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin" }
