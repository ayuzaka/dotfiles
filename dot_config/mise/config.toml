[bootstrap.packages]
"brew:git" = "latest"
"brew:vim" = "latest"
"brew:gnu-time" = "latest"
"brew:libsixel" = "latest"
"brew:terminal-notifier" = "latest"
"brew:tree" = "latest"
"brew:xdg-ninja" = "latest"
"brew:mas" = "latest"
"mas:1351639930" = "latest" # Gifski
"mas:6757801838" = "latest" # RunCat Neo

[bootstrap.macos.dock]
autohide = true
orientation = "right"
tilesize = 16
magnification = false
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = true
preferred_view_style = "icon"

[bootstrap.macos.keyboard]
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = true

[bootstrap.user]
login_shell = "/bin/zsh"

[settings]
idiomatic_version_file_enable_tools = ["node"]
experimental = true
minimum_release_age = "7d"
minimum_release_age_excludes = ["github:yusukebe/ax", "npm:@openai/codex"]
lockfile = true
not_found_auto_install = false

[settings.npm]
package_manager = "bun"
